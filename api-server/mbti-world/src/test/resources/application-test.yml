spring:
  config:
    activate:
      on-profile: test
  h2:
    console:
      enabled: true
  jpa:
    database: h2
    generate-ddl: off
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;
    username: SA
    password:
  sql:
    init:
      mode: always
      platform: h2
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 6000
      database: 3
  main:
    allow-bean-definition-overriding: true
  scheduler:
    enabled: false

## Logging
logging:
  level:
    org:
      hibernate:
        sql: debug
        type: trace
      springframework:
        web: debug